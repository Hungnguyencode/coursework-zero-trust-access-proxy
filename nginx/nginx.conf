events {}
http {
  upstream access_proxy { server access-proxy:8000; }
  upstream dashboard { server dashboard:80; }

  server {
    listen 80;
    location /api/ {
      proxy_pass http://access_proxy/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / { proxy_pass http://dashboard/; }
  }
}
