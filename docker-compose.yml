name: zero-trust

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zerotrust
      POSTGRES_USER: ztuser
      POSTGRES_PASSWORD: ztpass

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ztuser -d zerotrust"]
      interval: 5s
      timeout: 3s
      retries: 20

    volumes:
      - pgdata:/var/lib/postgresql/data

    networks:
      - zt-net


  opa:
    image: openpolicyagent/opa:latest-static

    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - /policy/policy.rego

    volumes:
      - ./opa:/policy:ro

    networks:
      - zt-net


  internal-api:
    build:
      context: ./internal_api

    image: zerotrust/internal-api:v0.1

    environment:
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET is required}

    networks:
      - zt-net


  access-proxy:
    build:
      context: ./access_proxy

    image: zerotrust/access-proxy:v0.1

    environment:
      DATABASE_URL: postgresql+psycopg2://ztuser:ztpass@postgres:5432/zerotrust

      OPA_URL: http://opa:8181/v1/data/zerotrust/authz

      INTERNAL_API_URL: http://internal-api:8000
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET is required}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "30"

      DEMO_ADMIN_KEY: demo-admin-key

    depends_on:
      postgres:
        condition: service_healthy

      opa:
        condition: service_started

      internal-api:
        condition: service_started

    networks:
      - zt-net


  dashboard:
    image: nginx:alpine

    volumes:
      - ./dashboard:/usr/share/nginx/html:ro

    networks:
      - zt-net


  nginx:
    image: nginx:alpine

    ports:
      - "8081:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - access-proxy
      - dashboard

    networks:
      - zt-net


  data-vault:
    build:
      context: ./data_vault

    image: zerotrust/data-vault:v0.1

    ports:
      - "8082:80"

    depends_on:
      access-proxy:
        condition: service_started

    networks:
      - zt-net

networks:
  zt-net:
    name: zero-trust-net


volumes:
  pgdata:
    name: zero-trust-pgdata

